[workspace]
resolver = "3"
members = ["crates/core", "crates/bridge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
mt-core = { path = "crates/core" }
mt_bridge = { path = "crates/bridge" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
uuid = { version = "1.17.0", features = ["v7", "serde"] }
# Stored match patterns are regular expressions. Linear-time matching (no catastrophic
# backtracking) matters here because patterns arrive from rule packs and from sync.
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
time = { version = "0.3.41", features = ["serde", "serde-well-known", "serde-human-readable", "macros", "formatting", "parsing"] }

[workspace.lints.rust]
# `deny` here rather than `forbid`, and the difference is deliberate. `mt-core` forbids
# unsafe in its own source, where the guarantee is worth stating absolutely. `mt-bridge`
# cannot: it holds the `flutter_rust_bridge` glue, which is FFI and unsafe by nature, so
# that one generated module carries an `allow` and every line anyone writes by hand is
# still denied.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
float_arithmetic = "deny"
as_conversions = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
