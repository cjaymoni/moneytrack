[workspace]
resolver = "3"
members = ["crates/core", "crates/bridge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
mt-core = { path = "crates/core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
uuid = { version = "1.17.0", features = ["v7", "serde"] }
# Stored match patterns are regular expressions. Linear-time matching (no catastrophic
# backtracking) matters here because patterns arrive from rule packs and from sync.
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
time = { version = "0.3.41", features = ["serde", "serde-well-known", "serde-human-readable", "macros", "formatting", "parsing"] }

[workspace.lints.rust]
# The unsafe policy, stated here once. The other two places that mention it — the module
# doc in `crates/bridge/src/lib.rs` and §3 of docs/ARCHITECTURE.md — describe their own
# corner of it and point back at this.
#
# `deny` rather than `forbid`, because a crate holding the `flutter_rust_bridge` glue
# cannot forbid unsafe at its root: FFI is unsafe by nature, and `forbid` cannot be
# switched off for the generated module.
#
# So `forbid` is applied one level in, where it still means something. Of the fifteen crate
# roots in this workspace — two libraries and thirteen integration tests — fourteen forbid
# unsafe outright, and `mt_bridge`'s six hand-written modules forbid it individually. The
# single exception is `crates/bridge/src/lib.rs`, which cannot, and the single `allow` is
# the generated module it holds.
#
# What this line governs, then, is that one root and anything added later that forgets to
# seal itself, where an `allow` can still override it. A new crate root or a new module in
# the bridge should carry its own `forbid`.
unsafe_code = "deny"
missing_docs = "warn"
# `frb_expand` is set by flutter_rust_bridge's own macro expansion and by nothing here, so
# the compiler is right that it never sees it defined. Declared rather than silenced, so a
# genuine typo in a `cfg` still warns. Workspace-wide although only the bridge needs it: a
# crate-local `[lints]` table replaces the inherited set rather than adding to it, and
# restating all eight denials to scope one `check-cfg` is the worse trade.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[workspace.lints.clippy]
float_arithmetic = "deny"
as_conversions = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
