[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/ffi", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
mt-core = { path = "crates/core" }
mt-store = { path = "crates/store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
uuid = { version = "1.17.0", features = ["v7", "serde"] }
# Stored match patterns are regular expressions. Linear-time matching (no catastrophic
# backtracking) matters here because patterns arrive from rule packs and from sync.
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
time = { version = "0.3.41", features = ["serde", "serde-well-known", "serde-human-readable", "macros", "formatting", "parsing"] }
# The device database. `bundled-sqlcipher-vendored-openssl` builds SQLCipher and its crypto
# from source rather than linking whatever the platform happens to ship: an Android handset
# has no SQLCipher at all, and iOS ships a plain SQLite that would silently open the file
# unencrypted.
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher-vendored-openssl", "time", "uuid"] }
# The FFI needs a runtime to keep blocking database work off the UI thread; the server needs
# one because it is a server. Features are selected per crate.
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
# Postgres, and deliberately not through `sqlx`. Cargo refuses a graph where two packages
# claim the same `links` value, and it decides that before it looks at features: `sqlx`
# names `sqlx-sqlite` as an optional dependency, `sqlx-sqlite` links the native `sqlite3`,
# and so does the `rusqlite` the device store is built on. Turning the SQLite driver off
# does not help, because the conflict is found during version selection.
#
# So the server would have held the device store hostage to its choice of SQL library for
# ever. `tokio-postgres` ends that: the two databases stop fighting over a native library,
# and the queries here were written by hand anyway.
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-time-0_3"] }
deadpool-postgres = "0.14.2"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "limit", "timeout"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
# Argon2id for passwords, and the OS generator for everything secret. No `Math.random`
# equivalent anywhere near a token.
argon2 = "0.6.0"
getrandom = "0.4.3"
sha2 = "0.11.1"
base64ct = { version = "1.8.3", features = ["std"] }
subtle = "2.6.1"
tempfile = "3.27.0"

[workspace.lints.rust]
# The unsafe policy, stated here once. §3 of docs/ARCHITECTURE.md and the module doc in
# `crates/ffi/src/lib.rs` describe their own corner of it and point back at this.
#
# `forbid`, with no exception anywhere. Under `flutter_rust_bridge` there had to be one:
# the generated glue was a file in the bridge crate, so that crate root could only `deny`
# and allow the one module. UniFFI writes its scaffolding from a macro instead, and the
# compiler does not fire lints inside another crate's macro expansion — so the FFI crate
# forbids unsafe like everything else, and what the lint governs is what it should govern:
# the code in this workspace that a person wrote. The boundary's own `unsafe` still exists,
# in the expansion, doing what an FFI boundary does.
#
# Being `forbid` rather than `deny`, no `#[allow]` anywhere beneath it can switch this off.
# A crate that genuinely needs unsafe one day changes this line, in a commit that says so.
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
float_arithmetic = "deny"
as_conversions = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
