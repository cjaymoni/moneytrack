<!doctype html>
<html lang="en">
<head>
<title>moneytrack — Add</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Stardos+Stencil:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/app.css">
<script src="../tokens/theme.js" defer></script>
</head>
<body>
<main class="mt-app">
  <div class="mt-statusbar" aria-hidden="true"><span>09:41</span><span>5G&nbsp;&nbsp;86%</span></div>

  <div class="mt-topbar">
    <button class="mt-back" type="button" aria-label="Cancel" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <h1 style="flex:1">New entry</h1>
    <button class="mt-chip" type="button">Cash</button>
  </div>

  <section class="mt-sheet">
    <div class="mt-entryfig" aria-label="Amount, 5 cedis">
      <span class="cur" style="font-size:22px;font-weight:600;color:var(--mt-ink-secondary)">GHS</span>5<span class="mt-caret" aria-hidden="true"></span>
    </div>

    <div class="mt-segs" role="group" aria-label="Direction">
      <button class="mt-seg" type="button" aria-pressed="true">Out</button>
      <button class="mt-seg" type="button" aria-pressed="false">In</button>
      <button class="mt-seg" type="button" aria-pressed="false">Transfer</button>
    </div>

    <div class="mt-label" style="padding-bottom:6px">Category</div>
    <p style="font-size:12.5px;color:var(--mt-ink-secondary);padding-bottom:var(--mt-c3)">Transport, from your last trotro fare.</p>
    <div class="mt-cats">
      <button class="mt-cat" type="button" aria-pressed="true">Transport</button>
      <button class="mt-cat" type="button" aria-pressed="false">Groceries</button>
      <button class="mt-cat" type="button" aria-pressed="false">Utilities</button>
      <button class="mt-cat" type="button" aria-pressed="false">Airtime</button>
      <button class="mt-cat" type="button" aria-pressed="false">Eating out</button>
      <button class="mt-cat" type="button" aria-pressed="false">Family</button>
      <button class="mt-cat" type="button" disabled>Rent &mdash; recurring</button>
    </div>

    <p style="font-size:12.5px;color:var(--mt-ink-secondary);padding-top:var(--mt-c4)">
      Dated today. Tap the date to change it, or set it ahead to make this a pending entry the outlook will count.
    </p>

    <div style="margin-top:auto;padding:var(--mt-c5) 0 var(--mt-c6)">
      <button class="mt-btn" type="button">Save entry</button>
    </div>
  </section>
</main>
</body>
</html>
