[package]
name = "mt-server"
description = "The API the browser talks to: Axum, Postgres, and the same mt-core the apps run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mt-core.workspace = true
axum.workspace = true
axum-extra.workspace = true
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
argon2.workspace = true
getrandom.workspace = true
sha2.workspace = true
base64ct.workspace = true
subtle.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
# The API tests run against a real Postgres, because the constraints doing the tenancy work
# are Postgres constraints and SQLite standing in for them would test nothing — and over
# real HTTP with a real cookie jar, because the session and the CSRF token are cookies and
# a test that bypasses them tests something else.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "charset", "http2"] }

[lints]
workspace = true
